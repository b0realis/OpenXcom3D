# The build guide and the play guide on GitHub Pages: https://b0realis.github.io/OpenXcom3D/
# (pages/index.html) and https://b0realis.github.io/OpenXcom3D/play.html (pages/play.html).
#
# Only pages/ is published: two pages that ask no other site for anything (no web fonts, no
# scripts from elsewhere; their links open other sites only when clicked). Each one's stored value
# (the reader's system and ticked steps) stays in the reader's browser. Nothing else in the
# repository becomes a web page.
#
# The Pages source is "GitHub Actions" (repository Settings > Pages). It runs when pages/ or this
# file changes on main, or by hand. The actions are their Node 24 majors, as in ShandalarGodot:
# checkout v5, configure-pages v6, upload-pages-artifact v5, deploy-pages v5.
# (tools/make_public.sh copies tools/workflows/ to .github/workflows/.)
name: Pages

on:
  push:
    branches: [main]
    paths: ["pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# The deployment waits a little after the upload, and tries once more a minute later if it still misses the artifact:
# since 2026-11 GitHub lists a freshly uploaded artifact seconds late (up to about 46 s seen), and deploy-pages looks it
# up once, at once ("No artifacts named github-pages were found"; actions/deploy-pages#451). Re-running the job can't
# mend that: it uploads a second artifact of the same name ("Multiple artifacts named github-pages").
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_again.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - name: Wait for the artifact to be listed
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait longer, the artifact not listed yet
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
